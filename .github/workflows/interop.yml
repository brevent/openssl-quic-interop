name: QUIC interop

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      clients:
        description: "Clients, comma separated, default openssl-lts,openssl-master,ngtcp2"
        default: ""
      tests:
        description: "Tests, comma separated, default all"
        default: ""
      nginx_commit:
        description: "Build nginx with commit (or branch, tag, pull/ID)"
        default: ""

permissions: {}

env:
  CLIENTS: ${{ inputs.clients }}
  TESTS: ${{ inputs.tests }}
  NGINX_COMMIT: ${{ inputs.nginx_commit }}

jobs:
  resolve:
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    outputs:
      openssl_lts_branch: ${{ steps.openssl.outputs.openssl_lts_branch }}
      matrix: ${{ steps.images.outputs.matrix }}
      nginx_image: ${{ steps.images.outputs.nginx_image }}
      nginx_label: ${{ steps.images.outputs.nginx_label }}
      nginx_url: ${{ steps.images.outputs.nginx_url }}
      nginx_commit: ${{ steps.images.outputs.nginx_commit }}
      nginx_digest: ${{ steps.images.outputs.nginx_digest }}

    steps:
    - name: Resolve openssl commits
      id: openssl
      if: ${{ env.CLIENTS == '' || contains(env.CLIENTS, 'openssl-lts') || contains(env.CLIENTS, 'openssl-master') }}
      run: |
        resolve_commit() {
            commit=$(git ls-remote https://github.com/openssl/openssl.git "refs/heads/$2" | cut -f1)
            [ -n "$commit" ] || exit 1
            echo "$1=$commit" >> "$GITHUB_OUTPUT"
        }
        lts=openssl-3.5
        echo "openssl_lts_branch=$lts" >> "$GITHUB_OUTPUT"
        resolve_commit openssl_lts "$lts"
        resolve_commit openssl_master master

    - name: Resolve clients and nginx
      id: images
      env:
        GH_TOKEN: ${{ github.token }}
        LTS_BRANCH: ${{ steps.openssl.outputs.openssl_lts_branch }}
        LTS_COMMIT: ${{ steps.openssl.outputs.openssl_lts }}
        MASTER_COMMIT: ${{ steps.openssl.outputs.openssl_master }}
      run: |
        impl=$(curl -fsSL https://raw.githubusercontent.com/quic-interop/quic-interop-runner/master/implementations_quic.json)
        resolve_client() {
            client=$1
            image=$(jq -er --arg c "$client" '.[$c] | select(.role == "client" or .role == "both") | .image' <<< "$impl") || {
                echo "::error::unknown client: $client"
                exit 1
            }
            digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
            name=$(docker buildx imagetools inspect "$image" | grep -m 1 '^Name:' | awk '{ print $2 }')
            if [ -z "$name" ]; then
                echo "::error::$client: cannot resolve image name for $image"
                exit 1
            fi
            url=https://$name
            case $name in
            docker.io/*)
                path=${name#docker.io/} path=${path%@*}
                repository=${path##*/} repository=${repository%%:*}
                namespace=${path%/*}
                if [ "$namespace" = library ]; then
                    url=https://hub.docker.com/_/$repository
                else
                    url=https://hub.docker.com/r/$namespace/$repository
                fi
                ;;
            ghcr.io/*)
                path=${image#ghcr.io/} owner=${path%%/*} package=${path#*/}
                package=$(jq -rn --arg p "${package%:*}" '$p | @uri')
                id=$(gh api "/orgs/$owner/packages/container/$package/versions" \
                    --jq ".[] | select(.name == \"$digest\") | .id") || true
                if [ -n "$id" ]; then
                    url=https://github.com/orgs/$owner/packages/container/$package/$id
                fi
                ;;
            esac
            entry=$(jq -nc --arg c "$client" --arg image "$image@$digest" --arg url "$url" --arg digest "$digest" \
                '{client: $c, label: $c, image: $image, url: $url, digest: $digest}')
        }
        matrix='[]'
        for client in $(tr ',' ' ' <<< "${CLIENTS:-openssl-lts,openssl-master,ngtcp2}"); do
            if jq -e --arg c "$client" 'any(.[]; .client == $c)' <<< "$matrix" > /dev/null; then
                continue
            fi
            case $client in
            openssl-lts)
                entry=$(jq -nc --arg label "$LTS_BRANCH" --arg commit "$LTS_COMMIT" --arg digest "${LTS_COMMIT:0:12}" \
                    '{client: "openssl-lts", label: $label, commit: $commit, curl_branch: "curl-8_18_0",
                      url: "https://github.com/openssl/openssl/commit/\($commit)", digest: $digest}') ;;
            openssl-master)
                entry=$(jq -nc --arg commit "$MASTER_COMMIT" --arg digest "${MASTER_COMMIT:0:12}" \
                    '{client: "openssl-master", label: "openssl-master", commit: $commit,
                      url: "https://github.com/openssl/openssl/commit/\($commit)", digest: $digest}') ;;
            *)
                resolve_client "$client" ;;
            esac
            matrix=$(jq -c --argjson e "$entry" '. + [$e]' <<< "$matrix")
        done
        if [ "$matrix" = '[]' ]; then
            echo "::error::no clients selected"
            exit 1
        fi
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

        resolve_image() {
            name=$1 repo=$2 package=$3
            org=${repo%%/*}
            image=ghcr.io/$org/$package
            digest=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')
            id=$(gh api "/orgs/$org/packages/container/$package/versions" \
                --jq ".[] | select(.name == \"$digest\") | .id") || true
            echo "${name}_image=$image@$digest" >> "$GITHUB_OUTPUT"
            echo "${name}_url=https://github.com/$repo/pkgs/container/$package/${id:-versions}" >> "$GITHUB_OUTPUT"
            echo "${name}_digest=$digest" >> "$GITHUB_OUTPUT"
        }

        if [ -z "$NGINX_COMMIT" ]; then
            resolve_image nginx brevent/nginx-quic-qns nginx-quic-qns
        else
            ref=$NGINX_COMMIT
            if [[ $ref == pull/* ]]; then ref=$ref/head; fi
            git init -q nginx
            git -C nginx fetch -q --depth=1 https://github.com/nginx/nginx "$ref" || {
                echo "::error::cannot fetch $ref from nginx/nginx"
                exit 1
            }
            commit=$(git -C nginx rev-parse FETCH_HEAD^{commit})
            case $NGINX_COMMIT in
            pull/*)
                label=nginx/nginx#${NGINX_COMMIT#pull/}
                url=https://github.com/nginx/nginx/$NGINX_COMMIT
                digest=${commit:0:12}
                ;;
            "$commit")
                label=nginx/nginx@${commit:0:12}
                url=https://github.com/nginx/nginx/commit/$commit
                digest=
                ;;
            *)
                label=nginx/nginx@$NGINX_COMMIT
                url=https://github.com/nginx/nginx/commit/$commit
                digest=${commit:0:12}
                ;;
            esac
            {
                echo "nginx_commit=$commit"
                echo "nginx_label=$label"
                echo "nginx_url=$url"
                echo "nginx_digest=$digest"
            } >> "$GITHUB_OUTPUT"
        fi

  nginx:
    needs: resolve
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      if: ${{ needs.resolve.outputs.nginx_commit != '' }}
      with:
        repository: brevent/nginx-quic-qns
        persist-credentials: false

    - name: Build nginx
      if: ${{ needs.resolve.outputs.nginx_commit != '' }}
      env:
        NGINX_COMMIT: ${{ needs.resolve.outputs.nginx_commit }}
      run: |
        docker build -t nginx-interop --build-arg NGINX_COMMIT="$NGINX_COMMIT" .
        docker run --rm --entrypoint /usr/sbin/nginx nginx-interop -V > nginx-V 2>&1
        cat nginx-V
        grep -qF -- "$NGINX_COMMIT" nginx-V
        docker save nginx-interop | zstd -T0 -3 -o nginx-interop.tar.zst

    - uses: actions/upload-artifact@v7
      if: ${{ needs.resolve.outputs.nginx_commit != '' }}
      with:
        name: nginx-image
        path: nginx-interop.tar.zst
        retention-days: 1

  interop:
    needs: [ resolve, nginx ]
    name: interop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      with:
        repository: quic-interop/quic-interop-runner
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/checkout@v7
      if: ${{ startsWith(matrix.client, 'openssl-') }}
      with:
        repository: openssl/openssl
        ref: ${{ matrix.commit }}
        path: openssl-src
        sparse-checkout: test/quic-openssl-docker
        persist-credentials: false

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install python requirements
      timeout-minutes: 5
      run: |
        for _ in 1 2 3; do
            timeout 60 pip install -r requirements.txt && exit 0
            sleep 5
        done
        exit 1

    - name: Install tshark
      timeout-minutes: 5
      run: |
        for _ in 1 2 3; do
            sudo timeout 60 apt-get update &&
                sudo timeout 60 apt-get install -y --no-install-recommends tshark &&
                exit 0
            sleep 5
        done
        exit 1

    - name: Patch implementations file
      run: |
        jq '. + {
              "openssl-lts": {image: "openssl-lts-interop", url: "https://github.com/openssl/openssl", role: "client"},
              "openssl-master": {image: "openssl-master-interop", url: "https://github.com/openssl/openssl", role: "client"}
            }' implementations_quic.json > implementations.tmp
        mv implementations.tmp implementations_quic.json

    - name: Set up docker
      uses: docker/setup-docker-action@v5
      with:
        version: "28.1.1"

    - name: Set up docker compose
      uses: docker/setup-compose-action@v2
      with:
        version: "v2.36.2"

    - name: Check docker version
      run: |
        docker version
        docker compose version

    - name: Prepare ${{ matrix.label }}
      env:
        IMAGE: ${{ matrix.image }}
        COMMIT: ${{ matrix.commit }}
        CURL_BRANCH: ${{ matrix.curl_branch }}
      run: |
        if [ -n "$IMAGE" ]; then
            docker pull "$IMAGE"
            docker tag "$IMAGE" "${{ matrix.client }}-interop"
            exit
        fi
        dir=openssl-src/test/quic-openssl-docker
        old='git clone --depth 1 -b \$OPENSSL_BRANCH \$OPENSSL_URL'
        new='git init openssl \&\& git -C openssl fetch --depth 1 $OPENSSL_URL $OPENSSL_BRANCH \&\& git -C openssl checkout FETCH_HEAD'
        sed -i "s|$old|$new|" "$dir/Dockerfile"
        grep -qF -- 'fetch --depth 1 $OPENSSL_URL $OPENSSL_BRANCH' "$dir/Dockerfile"
        if [ -n "$CURL_BRANCH" ]; then
            sed -i "s|clone --depth 1 https://github.com/curl/|clone --depth 1 -b $CURL_BRANCH https://github.com/curl/|" "$dir/Dockerfile"
            grep -qF -- "-b $CURL_BRANCH " "$dir/Dockerfile"
        fi
        docker build -t "${{ matrix.client }}-interop" --build-arg OPENSSL_BRANCH="$COMMIT" "$dir"

    - uses: actions/download-artifact@v7
      if: ${{ needs.resolve.outputs.nginx_commit != '' }}
      with:
        name: nginx-image

    - name: Prepare nginx
      env:
        NGINX_IMAGE: ${{ needs.resolve.outputs.nginx_image }}
      run: |
        if [ -z "$NGINX_IMAGE" ]; then
            zstd -dc nginx-interop.tar.zst | docker load
            exit
        fi
        docker pull "$NGINX_IMAGE"
        docker tag "$NGINX_IMAGE" nginx-interop

    - name: Run tests
      id: run
      env:
        LABEL: ${{ matrix.label }}
      run: |
        if [ -n "$TESTS" ]; then
            TESTS=$(python3 -c '
        import sys
        from testcases_quic import MEASUREMENTS, TESTCASES_QUIC
        names = {t.abbreviation(): t.name() for t in TESTCASES_QUIC + MEASUREMENTS}
        print(",".join(names[t.strip()] for t in sys.argv[1].split(",")))
        ' "$TESTS")
        fi
        python3 run.py -c ${{ matrix.client }} -s nginx -r nginx=nginx-interop,${{ matrix.client }}=${{ matrix.client }}-interop ${TESTS:+-t "$TESTS"} -d --log-dir logs -j result.json || true
        if [ ! -f result.json ]; then
            echo "::error title=$LABEL::no result"
            exit 1
        fi
        cp result.json "result-$LABEL.json"
        if ! jq -e '[.. | objects | select(has("result")) | select(.result != null)] | length > 0' result.json > /dev/null; then
            echo "::error title=$LABEL::no test was run"
            exit 1
        fi
        failed=$(jq -r '[.. | objects | select(has("result")) | select(.result != "succeeded" and .result != "unsupported") | "\(.abbr) \(.name)"] | join(", ")' result.json)
        if [ -n "$failed" ]; then
            echo "::warning title=$LABEL::failed: $failed"
            echo "failed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Keep only failed logs
      if: ${{ steps.run.outputs.failed == 'true' }}
      run: |
        jq -r '(.results[][], .measurements[][]) | select(.result == "succeeded") | .name' result.json |
        while IFS= read -r name; do
            rm -rfv -- "logs/nginx_${{ matrix.client }}/$name"
        done

    - name: Upload result
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: result-${{ matrix.label }}
        path: result-${{ matrix.label }}.json
        retention-days: 7

    - name: Upload logs
      if: ${{ failure() || steps.run.outputs.failed == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ matrix.label }}
        path: logs
        retention-days: 7

  results:
    needs: [ resolve, interop ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: publish-results
      queue: max

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/download-artifact@v7
      with:
        pattern: result-*
        merge-multiple: true

    - name: Generate summary
      env:
        OPENSSL_LTS_BRANCH: ${{ needs.resolve.outputs.openssl_lts_branch }}
        NGINX_LABEL: ${{ needs.resolve.outputs.nginx_label }}
        NGINX_URL: ${{ needs.resolve.outputs.nginx_url }}
        NGINX_DIGEST: ${{ needs.resolve.outputs.nginx_digest }}
        MATRIX: ${{ needs.resolve.outputs.matrix }}
      run: |
        if [ -n "$MATRIX" ]; then
            labels=$(jq -r '.[].label' <<< "$MATRIX")
        else
            labels="${OPENSSL_LTS_BRANCH:-openssl-lts} openssl-master ngtcp2"
        fi
        set --
        for label in $labels; do
            set -- "$@" "$label=result-$label.json"
        done
        python3 .github/summary.py "$@" > summary.md
        cat summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Publish results
      if: ${{ needs.resolve.result == 'success' && github.ref == 'refs/heads/main' && env.CLIENTS == '' && env.TESTS == '' && env.NGINX_COMMIT == '' }}
      env:
        GH_TOKEN: ${{ github.token }}
        TZ: Asia/Shanghai
      run: |
        url=https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git
        status=0
        git ls-remote --exit-code --heads "$url" results > /dev/null || status=$?
        case $status in
        0) git clone -q --depth 1 --branch results "$url" results ;;
        2) git init -q -b results results ;;
        *) exit "$status" ;;
        esac
        cd results
        week_ago=$(date -d '7 days ago' +%Y-%m-%d)
        for f in 20*.md; do
            if [ -e "$f" ] && [[ ${f:0:10} < $week_ago ]]; then
                rm "$f"
            fi
        done
        cp ../summary.md "$(date +%Y-%m-%d)-$GITHUB_RUN_NUMBER.md"
        {
            echo "# OpenSSL QUIC interop results"
            echo
            ls 20*.md | sort -rV | sed 's|\(.*\)\.md$|- [\1](\1.md)|'
        } > README.md
        git add -A
        git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "results of run $GITHUB_RUN_NUMBER"
        git push -q "$url" HEAD:results
