name: QUIC interop
run-name: "${{ github.event_name == 'schedule' && format('{0} #{1} (daily)', github.workflow, github.run_number) || inputs.run-name }}"

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      run-name:
        description: "Run name, default generated by GitHub"
        default: ""
      clients:
        description: "Clients, comma separated, default all"
        default: ""
      tests:
        description: "Tests, comma separated, default all"
        default: ""
      server:
        description: "Server: brevent (prebuilt), a server of the runner (nginx, haproxy, ...), or nginx commit (or branch, tag, pull/ID) to build"
        default: "brevent"
      rounds:
        description: "Rounds to run each client"
        default: "1"
      keep-logs:
        description: "Keep logs of all tests, default only failed"
        type: boolean
        default: false

permissions: {}

env:
  CLIENTS: ${{ github.event_name != 'workflow_dispatch' && 'openssl-3.5,openssl-master,ngtcp2' || inputs.clients }}
  TESTS: ${{ github.event_name == 'push' && 'H,3' || inputs.tests }}
  SERVER: ${{ inputs.server || 'brevent' }}
  WIRESHARK_VERSION: "4.6.9"

jobs:
  resolve:
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    outputs:
      builds: ${{ steps.images.outputs.builds }}
      matrix: ${{ steps.images.outputs.matrix }}
      server: ${{ steps.images.outputs.server }}
      server_image: ${{ steps.images.outputs.server_image }}
      server_label: ${{ steps.images.outputs.server_label }}
      server_url: ${{ steps.images.outputs.server_url }}
      server_digest: ${{ steps.images.outputs.server_digest }}
      nginx_commit: ${{ steps.images.outputs.nginx_commit }}

    steps:
    - name: Resolve clients and server
      id: images
      env:
        GH_TOKEN: ${{ github.token }}
        ROUNDS: ${{ inputs.rounds }}
      run: |
        impl=$(curl -fsSL https://raw.githubusercontent.com/quic-interop/quic-interop-runner/master/implementations_quic.json)
        resolve_impl() {
            client=$1 role=$2
            image=$(jq -er --arg c "$client" --arg r "$role" '.[$c] | select(.role == $r or .role == "both") | .image' <<< "$impl") || {
                echo "::error::unknown $role: $client"
                exit 1
            }
            digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
            name=$(docker buildx imagetools inspect "$image" | grep -m 1 '^Name:' | awk '{ print $2 }')
            if [ -z "$name" ]; then
                echo "::error::$client: cannot resolve image name for $image"
                exit 1
            fi
            url=https://$name
            case $name in
            docker.io/*)
                path=${name#docker.io/} path=${path%@*}
                repository=${path##*/} repository=${repository%%:*}
                namespace=${path%/*}
                if [ "$namespace" = library ]; then
                    url=https://hub.docker.com/_/$repository
                else
                    url=https://hub.docker.com/r/$namespace/$repository
                fi
                ;;
            ghcr.io/*)
                path=${image#ghcr.io/} owner=${path%%/*} package=${path#*/}
                package=$(jq -rn --arg p "${package%:*}" '$p | @uri')
                id=$(gh api "/orgs/$owner/packages/container/$package/versions" \
                    --jq ".[] | select(.name == \"$digest\") | .id") || true
                if [ -n "$id" ]; then
                    url=https://github.com/orgs/$owner/packages/container/$package/$id
                fi
                ;;
            esac
            image=$image@$digest
        }
        resolve_client() {
            resolve_impl "$1" client
            entry=$(jq -nc --arg c "$1" --arg image "$image" --arg url "$url" --arg digest "$digest" \
                '{client: $c, label: $c, image: $image, url: $url, digest: $digest}')
        }
        resolve_openssl() {
            local branch commit
            [ "$1" = openssl-master ] && branch=master || branch=$1
            commit=$(git ls-remote https://github.com/openssl/openssl.git "$branch" | cut -f1)
            if [ -z "$commit" ]; then
                echo "::error::no such branch in openssl/openssl: $branch"
                exit 1
            fi
            entry=$(jq -nc --arg c "$1" --arg commit "$commit" --arg digest "${commit:0:12}" \
                '{client: $c, label: $c, commit: $commit,
                  url: "https://github.com/openssl/openssl/commit/\($commit)", digest: $digest}')
        }
        if [ -z "$CLIENTS" ]; then
            CLIENTS=openssl-3.5,openssl-master,$(jq -r 'to_entries[]
                | select(.value.role == "client" or .value.role == "both") | .key' <<< "$impl" | tr '\n' ,)
        fi
        matrix='[]'
        for client in $(tr ',' ' ' <<< "$CLIENTS"); do
            if jq -e --arg c "$client" 'any(.[]; .client == $c)' <<< "$matrix" > /dev/null; then
                continue
            fi
            if [[ $client == openssl-* ]]; then
                resolve_openssl "$client"
            else
                resolve_client "$client"
            fi
            matrix=$(jq -c --argjson e "$entry" '. + [$e]' <<< "$matrix")
        done
        if [ "$matrix" = '[]' ]; then
            echo "::error::no clients selected"
            exit 1
        fi
        builds=$(jq -c 'map(select(.commit))' <<< "$matrix")
        server_entry=$(jq -c --arg s "$SERVER" '.[] | select(.client == $s)' <<< "$matrix")
        if [ "${ROUNDS:-1}" -gt 1 ]; then
            matrix=$(jq -c --argjson n "$ROUNDS" '[.[] as $e | range(1; $n + 1) | $e + {label: "\($e.label)-\(.)", name: $e.label}]' <<< "$matrix")
        fi
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

        label=$SERVER image= url= digest= commit=
        if [ "$SERVER" = brevent ]; then
            repo=brevent/nginx-quic-qns package=nginx-quic-qns
            image=ghcr.io/${repo%%/*}/$package
            digest=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')
            id=$(gh api "/orgs/${repo%%/*}/packages/container/$package/versions" \
                --jq ".[] | select(.name == \"$digest\") | .id") || true
            image=$image@$digest
            url=https://github.com/$repo/pkgs/container/$package/${id:-versions}
            label=nginx/nginx-quic-qns#17 SERVER=nginx
        elif [[ $SERVER == openssl-* ]]; then
            if [ -z "$server_entry" ]; then
                resolve_openssl "$SERVER"
                server_entry=$entry
                builds=$(jq -c --argjson e "$entry" '. + [$e]' <<< "$builds")
            fi
            label=$(jq -r .label <<< "$server_entry")
            url=$(jq -r .url <<< "$server_entry")
            digest=$(jq -r .digest <<< "$server_entry")
        elif jq -e --arg s "$SERVER" '.[$s] | select(.role == "server" or .role == "both")' <<< "$impl" > /dev/null; then
            resolve_impl "$SERVER" server
        else
            ref=$SERVER
            if [[ $ref == pull/* ]]; then ref=$ref/head; fi
            git init -q nginx
            git -C nginx fetch -q --depth=1 https://github.com/nginx/nginx "$ref" || {
                echo "::error::unknown server, and no such ref in nginx/nginx: $SERVER"
                exit 1
            }
            commit=$(git -C nginx rev-parse FETCH_HEAD^{commit})
            case $SERVER in
            pull/*)
                label=nginx/nginx#${SERVER#pull/}
                url=https://github.com/nginx/nginx/$SERVER
                digest=${commit:0:12}
                ;;
            "$commit")
                label=nginx/nginx@${commit:0:12}
                url=https://github.com/nginx/nginx/commit/$commit
                ;;
            *)
                label=nginx/nginx@$SERVER
                url=https://github.com/nginx/nginx/commit/$commit
                digest=${commit:0:12}
                ;;
            esac
            SERVER=nginx
        fi
        {
            echo "builds=$(jq -c 'if . == [] then [{label: "none"}] else . end' <<< "$builds")"
            echo "server=$SERVER"
            echo "server_image=$image"
            echo "server_label=$label"
            echo "server_url=$url"
            echo "server_digest=$digest"
            echo "nginx_commit=$commit"
        } >> "$GITHUB_OUTPUT"

  nginx:
    needs: resolve
    if: ${{ needs.resolve.outputs.nginx_commit != '' }}
    name: build (nginx)
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      with:
        repository: brevent/nginx-quic-qns
        persist-credentials: false

    - name: Build nginx
      env:
        NGINX_COMMIT: ${{ needs.resolve.outputs.nginx_commit }}
      run: |
        docker build -t nginx-interop --build-arg NGINX_COMMIT="$NGINX_COMMIT" .
        docker run --rm --entrypoint /usr/sbin/nginx nginx-interop -V > nginx-V 2>&1
        cat nginx-V
        grep -qF -- "$NGINX_COMMIT" nginx-V
        docker save nginx-interop | zstd -T0 -3 -o nginx-interop.tar.zst

    - uses: actions/upload-artifact@v7
      with:
        name: nginx-image
        path: nginx-interop.tar.zst
        retention-days: 1

  tshark:
    needs: resolve
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Check tshark image
      id: image
      run: |
        hash=$(cat .github/wireshark/* | sha256sum | cut -c1-12)
        image=ghcr.io/$GITHUB_REPOSITORY_OWNER/wireshark:$WIRESHARK_VERSION-$hash
        echo "image=$image" >> "$GITHUB_OUTPUT"
        if ! docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
            echo "build=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: docker/login-action@v4
      if: ${{ steps.image.outputs.build }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - uses: docker/build-push-action@v7
      if: ${{ steps.image.outputs.build }}
      with:
        context: .github/wireshark
        build-args: WIRESHARK_VERSION=${{ env.WIRESHARK_VERSION }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.description=wireshark ${{ env.WIRESHARK_VERSION }} debs built from ${{ github.repository }}@${{ github.sha }}
        annotations: |
          index,manifest:org.opencontainers.image.revision=${{ github.sha }}
          index,manifest:org.opencontainers.image.description=wireshark ${{ env.WIRESHARK_VERSION }} debs built from ${{ github.repository }}@${{ github.sha }}
        tags: ${{ steps.image.outputs.image }}
        push: true

  openssl:
    needs: resolve
    name: build (${{ matrix.label }})
    strategy:
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.builds) }}
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      if: ${{ matrix.commit }}
      with:
        repository: openssl/openssl
        ref: ${{ matrix.commit }}
        path: openssl-src
        sparse-checkout: test/quic-openssl-docker
        persist-credentials: false

    - uses: actions/checkout@v7
      if: ${{ matrix.commit }}
      with:
        path: self
        sparse-checkout: .github/patches
        persist-credentials: false

    - name: Build ${{ matrix.label }}
      if: ${{ matrix.commit }}
      env:
        CLIENT: ${{ matrix.client }}
        COMMIT: ${{ matrix.commit }}
        CURL_BRANCH: curl-8_18_0
      run: |
        dir=openssl-src/test/quic-openssl-docker
        cp -v self/.github/patches/"$CLIENT"/*.patch self/.github/patches/ 2> /dev/null || true
        for p in self/.github/patches/*.patch; do
            [ -f "$p" ] || continue
            if [[ $CLIENT == openssl-master && ${p##*/} == upstream-* ]]; then
                rm "$p"
            elif ! grep -q '^+++ b/test/quic-openssl-docker/' "$p"; then
                echo "include ${p##*/}"
            elif git -C openssl-src apply -R --check --include='test/quic-openssl-docker/*' < "$p" 2> /dev/null; then
                echo "ignore ${p##*/}"
                rm "$p"
            elif git -C openssl-src apply -C1 --include='test/quic-openssl-docker/*' --stat --apply < "$p"; then
                echo "::notice::patched openssl quic runner ${p##*/}"
            else
                echo "::error::$CLIENT: cannot patch ${p##*/}"
                exit 1
            fi
        done
        old='RUN git clone --depth 1 -b \$OPENSSL_BRANCH \$OPENSSL_URL'
        new='RUN --mount=type=bind,from=patches,target=/openssl-patches git init openssl \&\& git -C openssl fetch --depth 1 $OPENSSL_URL $OPENSSL_BRANCH \&\& git -C openssl checkout FETCH_HEAD \&\& for p in /openssl-patches/*.patch; do [ -f "$p" ] \|\| continue; git -C openssl apply -R --check -C1 --exclude=".github/*" < "$p" 2> /dev/null \&\& { echo "ignore ${p##*/}"; continue; }; git -C openssl apply -C1 --exclude=".github/*" --stat --apply < "$p" \|\| { echo "cannot patch ${p##*/}"; exit 1; }; if git -C openssl apply --numstat --exclude=".github/*" --exclude="test/quic-openssl-docker/*" < "$p" \| grep -q .; then echo "::notice::patched openssl ${p##*/}"; else echo "patched openssl ${p##*/}"; fi; done'
        sed -i "s|$old|$new|" "$dir/Dockerfile"
        grep -qF -- 'fetch --depth 1 $OPENSSL_URL $OPENSSL_BRANCH' "$dir/Dockerfile"

        if grep -qF -- 'clone --depth 1 https://github.com/curl/' "$dir/Dockerfile"; then
            sed -i "s|clone --depth 1 https://github.com/curl/|clone --depth 1 -b $CURL_BRANCH https://github.com/curl/|" "$dir/Dockerfile"
            grep -qF -- "-b $CURL_BRANCH " "$dir/Dockerfile"
        fi
        docker build -t "${{ matrix.client }}-builder" --build-arg OPENSSL_BRANCH="$COMMIT" \
            --build-context patches=self/.github/patches "$dir" 2>&1 |
            sed -n -e p -e 's/^#[0-9]* [0-9.]* \(::notice::.*\.patch\)$/\1/p'
        [ "${PIPESTATUS[0]}" = 0 ] || exit 1
        docker build -t "${{ matrix.client }}-interop" --build-arg BUILDER="${{ matrix.client }}-builder" self/.github/patches
        if docker run --rm --entrypoint sh "${{ matrix.client }}-interop" -c \
            'for f in /usr/local/bin/* $(command -v curl); do ldd "$f"; done' | grep 'not found'; then
            exit 1
        fi
        docker save "${{ matrix.client }}-interop" | zstd -T0 -3 -o "${{ matrix.client }}-interop.tar.zst"

    - uses: actions/upload-artifact@v7
      if: ${{ matrix.commit }}
      with:
        name: ${{ matrix.client }}-image
        path: ${{ matrix.client }}-interop.tar.zst
        retention-days: 1

  interop:
    needs: [ resolve, nginx, tshark, openssl ]
    if: ${{ !failure() && !cancelled() }}
    name: interop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
      with:
        repository: quic-interop/quic-interop-runner
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install python requirements
      timeout-minutes: 5
      run: |
        for _ in 1 2 3; do
            timeout 60 pip install -r requirements.txt && exit 0
            sleep 5
        done
        exit 1

    - name: Install tshark
      timeout-minutes: 5
      env:
        DEBIAN_FRONTEND: noninteractive
        IMAGE: ${{ needs.tshark.outputs.image }}
      run: |
        id=$(docker create "$IMAGE" -)
        sudo docker cp "$id:/debs" /opt/
        docker rm "$id"
        echo "deb [trusted=yes arch=$(dpkg --print-architecture)] file:/opt/debs ./" |
            sudo tee /etc/apt/sources.list.d/wireshark.list
        sudo mkdir -p /opt/debs-lists/partial
        offline="-o Dir::Etc::SourceList=/etc/apt/sources.list.d/wireshark.list -o Dir::Etc::SourceParts=- -o Dir::State::Lists=/opt/debs-lists -o Acquire::Languages=none"
        sudo apt-get $offline update
        sudo apt-get $offline install -y --no-install-recommends tshark
        tshark -v | head -1

    - name: Patch implementations file
      env:
        MATRIX: ${{ needs.resolve.outputs.matrix }}
        SERVER: ${{ needs.resolve.outputs.server }}
      run: |
        for name in $({ jq -r '.[].client' <<< "$MATRIX"; echo "$SERVER"; } |
            grep '^openssl-' | sort -u); do
            jq --arg n "$name" '. + {($n): {image: "\($n)-interop",
                  url: "https://github.com/openssl/openssl", role: "both"}}' \
                implementations_quic.json > implementations.tmp
            mv implementations.tmp implementations_quic.json
        done

    - name: Set up docker
      uses: docker/setup-docker-action@v5
      with:
        version: "28.1.1"

    - name: Set up docker compose
      uses: docker/setup-compose-action@v2
      with:
        version: "v2.36.2"

    - name: Check docker version
      run: |
        docker version
        docker compose version

    - uses: actions/download-artifact@v7
      if: ${{ matrix.commit }}
      with:
        name: ${{ matrix.client }}-image

    - name: Prepare ${{ matrix.label }}
      env:
        IMAGE: ${{ matrix.image }}
      run: |
        if [ -n "$IMAGE" ]; then
            docker pull "$IMAGE"
            docker tag "$IMAGE" "${{ matrix.client }}-interop"
            exit
        fi
        zstd -dc "${{ matrix.client }}-interop.tar.zst" | docker load

    - uses: actions/download-artifact@v7
      if: ${{ needs.resolve.outputs.nginx_commit != '' }}
      with:
        name: nginx-image

    - uses: actions/download-artifact@v7
      if: ${{ startsWith(needs.resolve.outputs.server, 'openssl-') && needs.resolve.outputs.server != matrix.client }}
      with:
        name: ${{ needs.resolve.outputs.server }}-image

    - name: Prepare ${{ needs.resolve.outputs.server_label }}
      env:
        CLIENT: ${{ matrix.client }}
        SERVER: ${{ needs.resolve.outputs.server }}
        SERVER_IMAGE: ${{ needs.resolve.outputs.server_image }}
      run: |
        if [ "$SERVER" = "$CLIENT" ]; then
            echo "same image as the client"
        elif [[ $SERVER == openssl-* ]]; then
            zstd -dc "$SERVER-interop.tar.zst" | docker load
            docker tag "$SERVER-interop" server-interop
        elif [ -z "$SERVER_IMAGE" ]; then
            zstd -dc nginx-interop.tar.zst | docker load
            docker tag nginx-interop server-interop
        else
            docker pull "$SERVER_IMAGE"
            docker tag "$SERVER_IMAGE" server-interop
        fi

    - name: Run tests
      id: run
      env:
        LABEL: ${{ matrix.label }}
        CLIENT: ${{ matrix.client }}
        SERVER: ${{ needs.resolve.outputs.server }}
      run: |
        if [ -n "$TESTS" ]; then
            TESTS=$(python3 -c '
        import sys
        from testcases_quic import MEASUREMENTS, TESTCASES_QUIC
        names = {t.abbreviation(): t.name() for t in TESTCASES_QUIC + MEASUREMENTS}
        print(",".join(dict.fromkeys(names[t.strip()] for t in sys.argv[1].split(","))))
        ' "$TESTS")
        fi
        replace=$CLIENT=$CLIENT-interop
        if [ "$SERVER" != "$CLIENT" ]; then replace=$SERVER=server-interop,$replace; fi
        python3 run.py -c "$CLIENT" -s "$SERVER" -r "$replace" ${TESTS:+-t "$TESTS"} -d --log-dir logs -j result.json || true
        if [ ! -f result.json ]; then
            echo "::error title=$LABEL::no result"
            exit 1
        fi
        cp result.json "result-$LABEL.json"
        if ! jq -e '[.. | objects | select(has("result")) | select(.result != null)] | length > 0' result.json > /dev/null; then
            echo "::error title=$LABEL::no test was run"
            exit 1
        fi
        failed=$(jq -r '[.. | objects | select(has("result")) | select(.result != "succeeded" and .result != "unsupported") | "\(.abbr) \(.name)"] | join(", ")' result.json)
        if [ -n "$failed" ]; then
            echo "::warning title=$LABEL::failed: $failed"
            echo "failed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Prune logs of passed tests
      if: ${{ steps.run.outputs.failed == 'true' && !inputs.keep-logs }}
      env:
        SERVER: ${{ needs.resolve.outputs.server }}
      run: |
        jq -r '(.results[][], .measurements[][]) | select(.result == "succeeded") | .name' result.json |
        while IFS= read -r name; do
            rm -rfv -- "logs/${SERVER}_${{ matrix.client }}/$name"
        done

    - name: Upload result
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: result-${{ matrix.label }}
        path: result-${{ matrix.label }}.json
        retention-days: 7

    - name: Upload logs
      if: ${{ failure() || steps.run.outputs.failed == 'true' || inputs.keep-logs }}
      uses: actions/upload-artifact@v7
      with:
        name: logs-${{ matrix.label }}
        path: logs
        retention-days: 7

  results:
    needs: [ resolve, interop ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: publish-results
      queue: max

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/download-artifact@v7
      with:
        pattern: result-*
        merge-multiple: true

    - name: Generate summary
      env:
        SERVER_LABEL: ${{ needs.resolve.outputs.server_label }}
        SERVER_URL: ${{ needs.resolve.outputs.server_url }}
        SERVER_DIGEST: ${{ needs.resolve.outputs.server_digest }}
        MATRIX: ${{ needs.resolve.outputs.matrix }}
      run: |
        if [ -n "$MATRIX" ]; then
            labels=$(jq -r '.[].label' <<< "$MATRIX")
        else
            labels="openssl-3.5 openssl-master ngtcp2"
        fi
        set --
        for label in $labels; do
            set -- "$@" "$label=result-$label.json"
        done
        python3 .github/summary.py "$@" > summary.md
        cat summary.md >> "$GITHUB_STEP_SUMMARY"
        width=$(printf '%s\n' $labels | awk '{ if (length > m) m = length } END { print m }')
        for label in $labels; do
            [ -f "result-$label.json" ] || continue
            jq -r '[.. | objects | select(has("result"))] as $r
                | ($r | map(select(.result == "succeeded")) | map(.abbr) | join(",")) as $ok
                | ($r | map(select(.result != "succeeded" and .result != "unsupported")) | map(.abbr) | join(",")) as $ko
                | ($r | map(select(.result == "unsupported")) | map(.abbr) | join(",")) as $no
                | (if $ok == "" then empty else "\u2713(\($ok))" end),
                  (if $ko == "" then empty else "\u2717(\($ko))" end),
                  (if $no == "" then empty else "\u2013(\($no))" end)' "result-$label.json" |
            while IFS= read -r line; do
                printf '%-*s  %s\n' "$width" "$label" "$line"
                label=
            done
        done

    - name: Publish results
      if: ${{ needs.resolve.result == 'success' && github.event_name == 'schedule' }}
      env:
        GH_TOKEN: ${{ github.token }}
        TZ: Asia/Shanghai
      run: |
        url=https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git
        status=0
        git ls-remote --exit-code --heads "$url" results > /dev/null || status=$?
        case $status in
        0) git clone -q --depth 1 --branch results "$url" results ;;
        2) git init -q -b results results ;;
        *) exit "$status" ;;
        esac
        cd results
        week_ago=$(date -d '7 days ago' +%Y-%m-%d)
        for f in 20*.md; do
            if [ -e "$f" ] && [[ ${f:0:10} < $week_ago ]]; then
                rm "$f"
            fi
        done
        cp ../summary.md "$(date +%Y-%m-%d)-$GITHUB_RUN_NUMBER.md"
        {
            echo "# OpenSSL QUIC interop results"
            echo
            ls 20*.md | sort -rV | sed 's|\(.*\)\.md$|- [\1](\1.md)|'
        } > README.md
        git add -A
        git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "results of run $GITHUB_RUN_NUMBER"
        git push -q "$url" HEAD:results
